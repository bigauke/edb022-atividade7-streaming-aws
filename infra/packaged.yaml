AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EDB022 Atividade 7 Streaming AWS
Parameters:
  DbHost:
    Type: String
    Default: test-host
  DbName:
    Type: String
    Default: test-db
  DbUser:
    Type: String
    Default: postgres
  DbPassword:
    Type: String
    Default: postgres
    NoEcho: true
Resources:
  ReclamacoesBucket:
    Type: AWS::S3::Bucket
  ReclamacoesQueueDLQ:
    Type: AWS::SQS::Queue
  ReclamacoesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: edb022-reclamacoes-queue
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - ReclamacoesQueueDLQ
          - Arn
        maxReceiveCount: 3
  ProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: edb022-atv7-producer
      CodeUri: 
        s3://edb022-atv7-sam-bucket-639251749009637392/a450b87ac22577abcee3471d434477f8
      Handler: lambda_function.handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          SQS_QUEUE_URL:
            Ref: ReclamacoesQueue
      Events:
        S3Upload:
          Type: S3
          Properties:
            Bucket:
              Ref: ReclamacoesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                - Name: prefix
                  Value: raw/reclamacoes/
                - Name: suffix
                  Value: .csv
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: edb022-atv7-consumer
      CodeUri: 
        s3://edb022-atv7-sam-bucket-639251749009637392/87d54768a4b0f6c646d89e7d7b7fe480
      Handler: lambda_function.handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          S3_BUCKET:
            Ref: ReclamacoesBucket
          S3_OUTPUT_PREFIX: refined/reclamacoes-bancos/
          DB_HOST:
            Ref: DbHost
          DB_NAME:
            Ref: DbName
          DB_USER:
            Ref: DbUser
          DB_PASSWORD:
            Ref: DbPassword
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - ReclamacoesQueue
              - Arn
            BatchSize: 10
            FunctionResponseTypes:
            - ReportBatchItemFailures
